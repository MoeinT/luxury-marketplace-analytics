services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: luxury_analytics
      POSTGRES_USER: dbt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d luxury_analytics"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile.dbt
    working_dir: /workspace/dbt
    volumes:
      - .:/workspace
    environment:
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_USER: dbt
      DBT_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["build", "--profiles-dir", "."]

volumes:
  postgres_data:
