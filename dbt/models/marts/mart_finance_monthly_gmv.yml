version: 2

models:
  - name: mart_finance_monthly_gmv
    description: >-
      Finance-reported monthly GMV preserved for board reporting. Grain: one
      row per reported month. Normal incremental builds append new months and
      retain existing values; a full refresh rebuilds them from the source.
      This table does not contain post-close adjustment postings.
    columns:
      - name: month_start
        data_type: date
        description: First day of the reported month.
        data_tests:
          - not_null
          - unique
      - name: reported_gmv_eur
        data_type: numeric(16, 2)
        description: GMV in euros reported by Finance at close, retained on incremental builds.
        data_tests:
          - not_null
      - name: closed_on
        data_type: date
        description: Date on which Finance closed the reporting month.
        data_tests:
          - not_null
